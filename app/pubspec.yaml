name: livehealthy_kyd
description: "LiveHealthy: Know Your Disease - plain-language, referenced facts about common chronic diseases, in Urdu and English."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_crashlytics: ^5.4.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/content/
    - assets/graphics/
    - assets/images/

  fonts:
    # Urdu reading text (design D10). OFL licence in assets/fonts/OFL.txt.
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B6E4F"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
